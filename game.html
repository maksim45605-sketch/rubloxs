
<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Игра</title><link rel="stylesheet" href="/style.css"></head>
<body><header class="topbar"><a class="brand" href="/"><img src="/assets/rublox.png"><b>RUBLOX</b></a><nav class="nav"><a href="/">Графики</a><a href="/marketplace">Торговая площадка</a><a href="/create">Создать</a><a href="/rubux">Робукс</a></nav><div class="top-actions"><input placeholder="Поиск"><a class="btn green" href="/register">Регистрация</a><a class="btn" href="/login">Войти</a></div></header>
<main class="game-page"><section class="hero-game"><img id="banner" class="game-banner"><div class="game-side"><h1 id="title"></h1><p>By Rublox Studio ✅</p><p class="muted">Возраст: Mild</p><button id="playBtn" class="play-main">▶</button><div class="reactions"><span>☆<small>Избранное</small></span><span>👍<small id="likes"></small></span><span>👤<small id="online"></small></span></div></div></section>
