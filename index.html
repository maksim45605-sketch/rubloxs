<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rublox</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="logo">
    <div class="logo-box">
      <div class="logo-hole"></div>
    </div>
    <span>RUBLOX</span>
  </div>

  <nav>
    <a href="#">Charts</a>
    <a href="#">Marketplace</a>
    <a href="#">Create</a>
    <a href="#">Rubux</a>
  </nav>

  <div class="right">
    <input placeholder="Поиск">
    <button class="green">Регистрация</button>
    <button>Вход</button>
  </div>
</header>

<section class="games">
  <h1>Популярные режимы</h1>

  <div class="grid">

    <div class="card" onclick="openGame('Anime Battle')">
      <img src="https://picsum.photos/500/300?1">
      <div class="info">
        <h3>Anime Battle</h3>
        <p>👤 12.4K • 👍 94%</p>
      </div>
    </div>

    <div class="card" onclick="openGame('Zombie Escape')">
      <img src="https://picsum.photos/500/300?2">
      <div class="info">
        <h3>Zombie Escape</h3>
        <p>👤 8.1K • 👍 91%</p>
      </div>
    </div>

    <div class="card" onclick="openGame('Mini War')">
      <img src="https://picsum.photos/500/300?3">
      <div class="info">
        <h3>Mini War</h3>
        <p>👤 19.3K • 👍 89%</p>
      </div>
    </div>

    <div class="card" onclick="openGame('Rublox Simulator')">
      <img src="https://picsum.photos/500/300?4">
      <div class="info">
        <h3>Rublox Simulator</h3>
        <p>👤 5.2K • 👍 97%</p>
      </div>
    </div>

  </div>
</section>

<div class="overlay" id="overlay">
  <div class="game-popup">
    <img src="https://picsum.photos/1000/500?5" class="banner">

    <div class="popup-content">
      <h2 id="gameTitle">Game</h2>

      <div class="badges">
        <span>🔥 Trending</span>
        <span>⭐ Popular</span>
        <span>⚔ Action</span>
      </div>

      <p>
        Сражайся с игроками, получай бейджи и открывай новые способности.
      </p>

      <button class="play-btn">PLAY</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
