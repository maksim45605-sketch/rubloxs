
<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Bluckram</title><link rel="stylesheet" href="/style.css"></head>
<body class="play-body">
<div class="hud-top"><div class="hud-brand" id="escLogo"><img src="/assets/rublox.png"><b>Bluckram</b></div><div class="players-top" id="playersTop"></div></div>
<button class="chat-open" id="chatOpen">Открыть чат</button><div class="chat-box" id="chatBox"><div class="chat-messages" id="chatMessages"></div><input id="chatInput" placeholder="Написать сообщение и Enter"></div>
<div class="world"><div class="spawn"></div><div class="player3d"><div class="phead"></div><div class="pbody"></div><div class="pleg l"></div><div class="pleg r"></div></div></div>
<div class="esc-menu" id="escMenu"><div class="esc-box"><h1>Меню</h1><div class="esc-actions"><button class="green" id="restartBtn">Restart</button><button id="leaveBtn">Leave</button><button id="inventoryBtn">Лупа</button></div><h2>Игроки</h2><div class="skin-cards"><div class="skin-card"><div class="avatar-head" style="margin:auto"></div><b id="playerNick"></b><p>Стандартный скин</p></div><div class="skin-card"><b>Одежда</b><p>Синяя футболка</p></div><div class="skin-card"><b>Анимации</b><p>Idle, Walk, Jump</p></div></div><div id="itemsPanel" style="display:none"><h2>Вещи на игроке</h2><div class="skin-cards"><div class="skin-card">3D Head</div><div class="skin-card">Blue Shirt</div><div class="skin-card">Classic Walk</div></div></div></div></div>
<script src="/data.js"></script><script src="/play.js"></script></body></html>
