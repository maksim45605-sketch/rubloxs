
<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Настройки</title><link rel="stylesheet" href="/style.css"></head><body><header class="topbar"><a class="brand" href="/"><img src="/assets/rublox.png"><b>RUBLOX</b></a><nav class="nav"><a href="/">Графики</a><a href="/profile">Профиль</a></nav><div class="top-actions"><input placeholder="Поиск"><a class="btn green" href="/register">Регистрация</a></div></header><main class="page"><div class="settings-card"><h1>Настройки</h1><label>Тема</label><select id="theme"><option>Светлая</option><option>Тёмная</option></select><label>Язык</label><select><option>Русский</option><option>English</option></select><label>Ник можно менять раз в 7 дней</label><input id="newNick" placeholder="Новый ник"><button class="green" id="changeNick">Изменить ник</button><label>Username за 50 робуксов</label><input placeholder="Новый username"><button>Купить за 50 робуксов</button></div></main><script src="/data.js"></script><script>renderHeaderUser();changeNick.onclick=()=>{const last=+localStorage.getItem('rublox_last_nick_change')||0;if(Date.now()-last<7*24*60*60*1000)return alert('Ник можно менять раз в 7 дней');if(!newNick.value.trim())return;setUser(newNick.value.trim());localStorage.setItem('rublox_last_nick_change',Date.now());alert('Ник изменён');location.reload();}</script></body></html>
